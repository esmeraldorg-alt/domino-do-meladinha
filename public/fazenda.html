<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24170d">
<link rel="manifest" href="/fazenda.webmanifest">
<link rel="apple-touch-icon" href="/farm-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fazenda Mainha 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: faixa de status no topo, mesa de jogo (canvas) no meio, barra de ferramentas embaixo, controles de toque sobre o canto. Um visual só, quente e terroso. */
:root{
  --barro-esc:#24170d; --barro:#3f2a19; --barro-claro:#5e4129; --creme:#fbefd2; --creme-mudo:#d6bf93;
  --ouro:#f0b84a; --mato:#86b852; --argila:#cf7b4c; --agua:#5aa6d6; --rosa:#e2735a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --corpo:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--barro-esc);color:var(--creme);font-family:var(--corpo);font-size:15px;overflow:hidden;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:0;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:1100px;margin:0 auto;padding-block:6px}
h2{font-family:var(--display);font-weight:700;margin:0}

/* faixa de status */
#hud{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--barro);border:1px solid var(--barro-claro);border-radius:14px;padding:6px 12px}
#hud .nome{font-family:var(--display);font-size:20px;line-height:1;color:var(--ouro);margin-right:4px}
#hud .dado{display:flex;flex-direction:column;line-height:1.05;min-width:0}
#hud .dado small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--creme-mudo)}
#hud .dado b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
#folego{flex:1;min-width:90px}
#folego .barra{height:8px;border-radius:5px;background:var(--barro-esc);overflow:hidden;margin-top:3px}
#folego i{display:block;height:100%;width:100%;background:var(--mato);transition:width .2s,background .2s}
#folego.baixo i{background:var(--rosa)}

/* mesa */
#palco{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:12px;border:2px solid var(--barro-claro);background:#000;touch-action:none}
#info{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;max-width:92%;background:rgba(36,23,13,.88);border:1px solid var(--barro-claro);border-radius:10px;padding:4px 10px;font-size:13px;text-align:center;pointer-events:none}
#info:empty{display:none}
#obj{background:var(--ouro);color:#2a1a08;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:700;text-align:center}
#obj:empty{display:none}
#toasts{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;pointer-events:none;max-width:70%}
.toast{background:rgba(36,23,13,.92);border:1px solid var(--ouro);border-radius:10px;padding:5px 10px;font-size:13px;animation:entra .2s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

#nomes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.nm{position:absolute;transform:translate(-50%,-100%);background:rgba(36,23,13,.78);border:1px solid var(--barro-claro);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--creme)}
.nm.eu{border-color:var(--ouro);color:var(--ouro)}
#acorda{position:absolute;left:50%;transform:translateX(-50%);bottom:48px;z-index:5}
input{font:inherit;background:var(--barro-claro);color:var(--creme);border:1px solid var(--barro-claro);border-radius:8px;padding:6px 8px;width:150px;max-width:100%;user-select:text;-webkit-user-select:text}
/* ferramentas */
#sub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}#sub:empty{display:none}
#sub .ferr{min-width:70px;background:var(--barro-esc)}
#barra{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#barra::-webkit-scrollbar{display:none}
.ferr{flex:0 0 auto;min-width:76px;background:var(--barro);border:1px solid var(--barro-claro);border-radius:12px;padding:5px 9px;text-align:left;line-height:1.1}
.ferr b{display:block;font-size:13px}
.ferr small{display:block;font-size:11px;color:var(--creme-mudo);white-space:nowrap}
.ferr .k{float:right;font-size:10px;color:var(--creme-mudo);border:1px solid var(--barro-claro);border-radius:4px;padding:0 4px;margin-left:6px}
.ferr.sel{border-color:var(--ouro);background:#5a3d1f}
.ferr.sel b{color:var(--ouro)}
.ferr.acao{background:var(--barro-esc)}

/* toque */
#toque{position:absolute;inset:0;pointer-events:none;display:block}
#joy{position:absolute;left:10px;bottom:34px;width:120px;height:120px;border-radius:50%;background:rgba(251,239,210,.12);border:2px solid rgba(251,239,210,.3);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(251,239,210,.55)}
.bt{position:absolute;pointer-events:auto;touch-action:none;width:68px;height:68px;border-radius:50%;border:2px solid rgba(251,239,210,.5);background:rgba(240,184,74,.55);color:#2a1a08;font-family:var(--display);font-weight:700;font-size:18px}
#btA{right:12px;bottom:40px}
#btB{right:92px;bottom:20px;width:54px;height:54px;font-size:14px;background:rgba(251,239,210,.3);color:var(--creme)}

/* janelas */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,12,6,.78);display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none}
.cartao{background:var(--barro);border:1px solid var(--barro-claro);border-radius:18px;padding:18px;width:100%;max-width:480px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.cartao h2{font-size:26px;color:var(--ouro);line-height:1.05}
.cartao p{margin:0;line-height:1.4}
.cartao .mudo{color:var(--creme-mudo);font-size:13px}
.lista{display:flex;flex-direction:column;gap:6px}
.linha{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--barro-esc);border-radius:10px;padding:7px 10px}
.linha span{min-width:0}
.linha small{display:block;color:var(--creme-mudo);font-size:12px}
.botoes{display:flex;gap:8px;flex-wrap:wrap}
.b{min-height:44px;border-radius:12px;border:0;background:var(--ouro);color:#2a1a08;font-weight:700;padding:0 16px;box-shadow:0 3px 0 #a87a22}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 #a87a22}
.b.fraco{background:transparent;color:var(--creme);border:1px solid var(--barro-claro);box-shadow:none}
.b.peq{min-height:36px;padding:0 12px;font-size:14px}
.b[disabled]{opacity:.45;box-shadow:none}
.pagina{background:#f3e2b8;color:#3a2815;border-radius:10px;padding:10px 12px;font-style:italic;line-height:1.4}
.pagina.perdida{background:var(--barro-esc);color:var(--creme-mudo);font-style:normal}
button:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){#hud .nome{display:none}}
</style>

<div id="app">
  <header id="hud">
    <span class="nome">Fazenda Mainha</span>
    <div class="dado"><small id="hEst">Primavera</small><b id="hDia">Dia 1</b></div>
    <div class="dado"><small>Hora</small><b id="hHora">06:00</b></div>
    <div class="dado"><small>Tempo</small><b id="hClima">Sol</b></div>
    <div class="dado"><small>Réis</small><b id="hReis">0</b></div>
    <div class="dado"><small>Sono</small><b id="hSono">0/8 h</b></div>
    <div class="dado"><small>Madeira</small><b id="hMad">0</b></div>
    <div class="dado" id="folego"><small>Fôlego</small><div class="barra"><i id="hFol"></i></div></div>
  </header>
  <div id="obj"></div>
  <main id="palco">
    
    <div id="nomes"></div>
    <button class="b" id="acorda" hidden>Acordar</button>
    <div id="info"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="toque">
      <div id="joy"><i id="joyK"></i></div>
      <button class="bt" id="btB" aria-label="Trocar ferramenta">Troca</button>
      <button class="bt" id="btA" aria-label="Usar">Usar</button>
    </div>
  </main>
  <div id="sub"></div>
  <nav id="barra" aria-label="Ferramentas"></nav>
</div>
<div id="modal" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var T=32,W=16,H=11,PX0=4,PY0=6,PW=8,PH=4,DIA_S=210,MIN_DIA=1200,SAVE='fazenda-mainha-3d-v1';
var ESTACOES=['Primavera','Verão','Outono','Inverno'],CHUVA=[0.35,0.15,0.3,0.2];

/* ---------- dados do jogo ---------- */
var CROPS={
  milho:{nome:'Milho',dias:4,fam:'gramínea',base:2,preco:25,semente:10,veia:'ferro'},
  feijao:{nome:'Feijão',dias:3,fam:'leguminosa',base:2,preco:20,semente:8,veia:'humus'},
  mandioca:{nome:'Mandioca',dias:5,fam:'raiz',base:1,preco:40,semente:15,veia:'argila'},
  pequi:{nome:'Pequi',dias:7,fam:'árvore',base:1,preco:110,semente:40,veia:'cristal'}
};
var SEMENTES=['milho','feijao','mandioca','pequi'];
var MINERIOS={ferro:{nome:'Minério de ferro',preco:30},argila:{nome:'Argila',preco:15},humus:{nome:'Húmus',preco:0},salitre:{nome:'Salitre',preco:25},cristal:{nome:'Cristal',preco:150},fossil:{nome:'Fóssil',preco:80}};
var QN=['comum','boa','excelente'],QM=[1,1.25,1.6];
var FERR=[
  {id:'enxada',nome:'Enxada',custo:3,tecla:'1'},
  {id:'semente',nome:'Semente',custo:1,tecla:'2'},
  {id:'regador',nome:'Regador',custo:2,tecla:'3'},
  {id:'colher',nome:'Colher',custo:2,tecla:'4'},
  {id:'adubo',nome:'Adubo',custo:1,tecla:'5'},
  {id:'picareta',nome:'Picareta',custo:4,tecla:'6'},
  {id:'machado',nome:'Machado',custo:5,tecla:'7'}
];
var PAGINAS=[
  'Chegamos hoje no sítio, meu fi. A terra daqui é teimosa de chão duro, mas quem tem paciência escuta ela falar.',
  'Cavei o poço fundo e achei o chão respondendo. O que a gente planta em cima aparece embaixo, nas pedras. Não contei pra ninguém, iam dizer que foi insolação.',
  'Feijão bota ânimo na terra. Depois dele o milho vem alto que nem fiador. Terra que descansa paga em dobro.',
  'Dona Cida jura que a mandioca tem raiz que desce até o fim do mundo. Eu não duvido mais.',
  'Achei um osso de bicho que ninguém conhece. Guardei no pé do pequi. Se o bicho gosta, a terra também gosta.',
  'Se você está lendo isso é porque voltou. Cuida do sítio com calma, que a pressa a terra não perdoa. Mainha.'
];
var OBJ=[
  'Aperte 1 para pegar a Enxada. Ande até a terra e aperte E para preparar um canteiro.',
  'Aperte 2 (Semente) e plante um milho no canteiro preparado.',
  'Aperte 3 (Regador) e regue o canteiro.',
  'Vá até a porta da casa e durma (E). O milho cresce enquanto você descansa.',
  'Regue todo dia até o milho amadurecer, depois colha com a Colher (4).',
  'Vá ao poço, aperte E para descer e use a Picareta (6) no veio que abriu embaixo do canteiro.',
  'Leve o que achou à caixa de expedição, perto da casa. Pagam na manhã seguinte.',
  'Fale com a Dona Cida, no armazém. Ela tem um pedido para você.',
  'Agora é com você: troque as culturas a cada safra. A terra lembra o que você plantou nela.'
];
function qtdCol(S,c,qmin){var n=0;for(var q=qmin;q<3;q++)n+=S.col[c+':'+q]||0;return n}
function tirarCol(S,c,qmin,n){for(var q=qmin;q<3&&n>0;q++){var k=c+':'+q,t=Math.min(S.col[k]||0,n);if(t){S.col[k]-=t;n-=t}}}
var PEDIDOS=[
  {txt:'3 milhos, de qualquer qualidade',ok:function(S){return qtdCol(S,'milho',0)>=3},faz:function(S){tirarCol(S,'milho',0,3)},reis:100},
  {txt:'2 mandiocas de qualidade boa ou melhor',ok:function(S){return qtdCol(S,'mandioca',1)>=2},faz:function(S){tirarCol(S,'mandioca',1,2);S.sem.pequi++},reis:160,extra:'1 semente de pequi'},
  {txt:'1 cristal, daqueles que brilham na gruta',ok:function(S){return S.min.cristal>=1},faz:function(S){S.min.cristal--},reis:300},
  {txt:'4 feijões de qualidade excelente',ok:function(S){return qtdCol(S,'feijao',2)>=4},faz:function(S){tirarCol(S,'feijao',2,4)},reis:260}
];

/* ---------- mapas ---------- */
var SUP=[],GR=[];
function build(){
  for(var y=0;y<H;y++){SUP[y]=[];GR[y]=[];for(var x=0;x<W;x++){SUP[y][x]='g';GR[y][x]='#'}}
  var x,y;
  for(x=0;x<W;x++)SUP[10][x]='r';
  for(x=2;x<=13;x++)SUP[5][x]='d';
  for(y=3;y<=5;y++)SUP[y][8]='d';
  SUP[4][2]='d';
  for(y=PY0;y<PY0+PH;y++)for(x=PX0;x<PX0+PW;x++)SUP[y][x]='p';
  for(y=1;y<=3;y++)for(x=1;x<=4;x++)SUP[y][x]='h';
  SUP[3][2]='door';
  for(y=1;y<=3;y++)for(x=11;x<=14;x++)SUP[y][x]='a';
  SUP[4][12]='npc';SUP[4][5]='cx';SUP[2][8]='po';
  [[0,0],[15,0],[0,6],[0,8],[15,6],[15,8],[14,9],[1,9],[6,1],[9,0],[0,3]].forEach(function(t){SUP[t[1]][t[0]]='t'});
  for(x=4;x<=11;x++)GR[5][x]='f';
  for(y=3;y<=5;y++)GR[y][8]='f';
  GR[2][8]='es';
  for(y=PY0;y<PY0+PH;y++)for(x=PX0;x<PX0+PW;x++)GR[y][x]='f';
}
build();
function plotIdx(x,y){return(x>=PX0&&x<PX0+PW&&y>=PY0&&y<PY0+PH)?(y-PY0)*PW+(x-PX0):-1}
function idxXY(i){return{x:PX0+(i%PW),y:PY0+Math.floor(i/PW)}}

/* ---------- estado ---------- */
var S=null;
function novoEstado(){
  var plots=[];for(var i=0;i<PW*PH;i++)plots.push({e:'grama',c:null,dr:0,m:false,ad:null,rot:0,h:[]});
  return{dia:1,hora:0,clima:'sol',reis:60,folego:100,camada:'sup',
    p:{x:4.5,y:5.5,fx:0,fy:1},plots:plots,veias:{},caixa:[],paginas:[],pedido:0,obj:0,ferr:0,semSel:'milho',adSel:'humus',
    sem:{milho:4,feijao:3,mandioca:0,pequi:0},col:{},min:{ferro:0,humus:0,argila:0,salitre:0,cristal:0,fossil:0},visto:false,sonoHoje:0,dorme:null,nomes:{eu:'Roceiro',cida:'Dona Cida',cao:'Totó'},cao:{amizade:0,cacando:null,carinhoDia:0},caca:{prea:0,codorna:0,tatu:0},madeira:0,cortadas:{},arv:{},obras:[]};
}
function guardar(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function carregar(){
  try{
    var t=localStorage.getItem(SAVE);if(!t)return null;
    var o=JSON.parse(t),b=novoEstado();
    if(!o||!o.plots||o.plots.length!==b.plots.length)return null;
    for(var k in b)if(o[k]===undefined)o[k]=b[k];o.dorme=null;o.colocando=null;if(!o.nomes||!o.nomes.eu)o.nomes=b.nomes;if(!o.nomes.cao)o.nomes.cao='Totó';
    return o;
  }catch(e){return null}
}
function est(){return Math.min(3,Math.floor((S.dia-1)/28)%4)}
function estagio(pl){
  if(!pl.c)return 0;
  var d=CROPS[pl.c].dias;
  if(pl.dr>=d)return 3;if(pl.dr>=Math.ceil(d*0.6))return 2;if(pl.dr>=1)return 1;return 0;
}

/* ---------- avisos e janelas ---------- */
function toast(t){
  var e=document.createElement('div');e.className='toast';e.textContent=t;
  var box=$('toasts');box.appendChild(e);while(box.children.length>3)box.firstChild.remove();
  setTimeout(function(){if(e.parentNode)e.remove()},3200);
}
var pausa=false;
function abrir(titulo,corpo,botoes){
  pausa=true;
  var h='<div class="cartao" role="dialog"><h2>'+titulo+'</h2>'+corpo+'<div class="botoes" id="mBot"></div></div>';
  var m=$('modal');m.innerHTML=h;m.hidden=false;
  var bx=$('mBot');
  (botoes||[{t:'Fechar',fn:fechar}]).forEach(function(b,i){
    var el=document.createElement('button');el.className='b'+(b.fraco?' fraco':'')+(b.peq?' peq':'');el.textContent=b.t;
    if(b.off)el.disabled=true;
    el.onclick=function(){b.fn()};bx.appendChild(el);
    if(i===0)setTimeout(function(){el.focus()},0);
  });
}
function fechar(){$('modal').hidden=true;$('modal').innerHTML='';pausa=false;in_.dx=0;in_.dy=0}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function evt(k){if(S.obj===k){S.obj=k+1;hud()}}

/* ---------- ações ---------- */
function frente(){var p=S.p;return{x:Math.floor(p.x+p.fx*0.85),y:Math.floor(p.y+p.fy*0.85)}}
function obraEm(x,y){for(var i=0;i<S.obras.length;i++){var o=S.obras[i];if(o.x===x&&o.y===y)return o.t}return null}
function tipo(x,y){if(x<0||y<0||x>=W||y>=H)return'#';if(S.camada!=='sup')return GR[y][x];var q=SUP[y][x];if(q==='t'&&S.cortadas[x+','+y])return'g';var ob=obraEm(x,y);if(ob)return ob==='banco'?'bn':'o';return q}
function gastar(n){
  if(S.obras.some(function(o){return o.t==='galpao'}))n=Math.max(1,n-1);
  if(S.folego<n){toast('Sem fôlego. Que tal dormir?');return false}
  S.folego-=n;hud();return true;
}
function calcRot(pl,crop){
  var ult=pl.h.length?pl.h[pl.h.length-1]:null,fam=CROPS[crop].fam;
  if(!ult)return 0;if(ult===fam)return-1;return ult==='leguminosa'?2:1;
}
function rotTxt(r){return r===2?'terra adubada pelo feijão':r===1?'terra descansada':r===-1?'terra cansada (mesma família)':'sem histórico'}
function usar(){
  if(S.dorme)return;
  if(pausa)return;
  var f=frente(),t=tipo(f.x,f.y);
  if(S.camada==='sup'){
    if(cao.vis&&caoTile().x===f.x&&caoTile().y===f.y)return caoInteracao();
    if(t==='door'){return descansarJanela(true)}
    if(t==='cx'){return caixaJanela()}
    if(t==='po'){return descer()}
    if(t==='npc'){return cidaJanela()}
    if(t==='t')return cortar(f.x,f.y);if(t==='bn')return sentarBanco(f.x,f.y);if(t==='p')return agir(plotIdx(f.x,f.y));
    return;
  }
  if(t==='es')return subir();
  if(t==='f'&&plotIdx(f.x,f.y)>=0)return minerar(plotIdx(f.x,f.y));
}
function agir(i){
  var pl=S.plots[i],id=FERR[S.ferr].id,c=FERR[S.ferr].custo;
  if(id==='enxada'){
    if(pl.e!=='grama'){toast(pl.c?'Tem planta aí.':'Esse canteiro já está preparado.');return}
    if(!gastar(c))return;pl.e='terra';if(S.obj===0)evt(0);return;
  }
  if(id==='semente'){
    if(pl.e!=='terra'){toast('Prepare o canteiro com a Enxada primeiro.');return}
    if(pl.c){toast('Já tem planta aí.');return}
    var s=S.semSel;if(!S.sem[s]){toast('Sem sementes de '+CROPS[s].nome.toLowerCase()+'. Toque em Semente de novo para trocar, ou compre no armazém.');return}
    if(!gastar(c))return;
    S.sem[s]--;barra();pl.c=s;pl.dr=0;pl.rot=calcRot(pl,s);pl.m=(S.clima==='chuva');
    toast(CROPS[s].nome+' plantado ('+rotTxt(pl.rot)+')');evt(1);return;
  }
  if(id==='regador'){
    if(pl.e!=='terra'){toast('Só dá para regar terra preparada.');return}
    if(pl.m){toast('Já está molhado hoje.');return}
    if(!gastar(c))return;pl.m=true;evt(2);return;
  }
  if(id==='colher'){
    if(!pl.c){toast('Nada para colher aqui.');return}
    if(estagio(pl)<3){toast(CROPS[pl.c].nome+' ainda não amadureceu.');return}
    if(!gastar(c))return;colher(i);return;
  }
  if(id==='adubo'){
    if(pl.e!=='terra'){toast('Adube só terra preparada.');return}
    if(pl.ad){toast('Esse canteiro já foi adubado.');return}
    var a=S.adSel;if(!S.min[a]){toast('Você não tem '+MINERIOS[a].nome.toLowerCase()+'. Toque em Adubo para trocar.');return}
    if(!gastar(c))return;S.min[a]--;barra();pl.ad=a;toast(MINERIOS[a].nome+' espalhado no canteiro');return;
  }
  if(id==='picareta'){toast('A picareta é para a gruta. O poço fica perto da casa.')}
}
function colher(i){
  var pl=S.plots[i],cd=CROPS[pl.c];
  var pts=(pl.ad?1:0)+(pl.rot>=1?1:0)+(pl.rot===2?1:0)+(pl.rot<0?-1:0);
  var q=Math.max(0,Math.min(2,pts));
  var n=Math.max(1,cd.base+(pl.rot>0?1:0)-(pl.rot<0?1:0));
  var k=pl.c+':'+q;S.col[k]=(S.col[k]||0)+n;
  toast('+'+n+' '+cd.nome.toLowerCase()+' ('+QN[q]+')');
  pl.h.push(cd.fam);if(pl.h.length>2)pl.h.shift();
  if(S.veias[i])S.veias[i].expira=S.dia+1;
  pl.c=null;pl.dr=0;pl.ad=null;pl.e='terra';pl.rot=0;
  evt(4);hud();
}
function descer(){S.camada='gruta';S.p.x=8.5;S.p.y=3.5;S.p.fx=0;S.p.fy=1;S.ferr=5;toast('Você desceu pela escada do poço.');hud();barra()}
function subir(){S.camada='sup';S.p.x=8.5;S.p.y=3.5;S.p.fx=0;S.p.fy=1;S.ferr=0;toast('De volta à superfície.');hud();barra()}
function minerar(i){
  var v=S.veias[i];
  if(!v){toast(S.plots[i].c&&estagio(S.plots[i])>=2?'As raízes ainda não chegaram aqui embaixo. Falta amadurecer.':'Nada aqui. Plante lá em cima e espere.');return}
  if(FERR[S.ferr].id!=='picareta'){toast('Pegue a Picareta (tecla 6).');return}
  if(!gastar(FERR[5].custo))return;
  S.min[v.tipo]+=v.qtd;barra();
  toast('+'+v.qtd+' '+MINERIOS[v.tipo].nome.toLowerCase());
  var fossil=v.extra==='fossil';
  delete S.veias[i];
  if(fossil){
    S.min.fossil++;toast('+1 fóssil');
    if(S.paginas.length<PAGINAS.length){S.paginas.push(S.paginas.length);setTimeout(function(){caderno(true)},350)}
  }
  evt(5);hud();
}
function geraVeia(i){
  var pl=S.plots[i],c=pl.c,cd=CROPS[c];if(!c||S.veias[i])return;
  var tp=cd.veia,qtd=1,extra=null;
  if(c==='milho'){
    var viz=[i-1,i+1,i-PW,i+PW];
    for(var k=0;k<viz.length;k++){
      var j=viz[k];if(j<0||j>=S.plots.length)continue;
      if((k<2)&&Math.floor(j/PW)!==Math.floor(i/PW))continue;
      if(S.plots[j].c==='feijao'){tp='salitre';break}
    }
    qtd=1+Math.floor(Math.random()*2);
  }else if(c==='feijao'){qtd=2}
  else if(c==='mandioca'){qtd=2;if(Math.random()<0.25)extra='fossil'}
  else if(c==='pequi'){qtd=1;if(Math.random()<0.5)extra='fossil'}
  S.veias[i]={tipo:tp,qtd:qtd,extra:extra,expira:null};
}

function iniciarSono(tipo,h,encerra){
  var ef=tipo==='cama'?1:tipo==='chao'?.7:tipo==='banco'?.6:.4;
  fechar();rota=null;
  if(encerra)h=Math.max(1,(8-S.sonoHoje)/ef);
  S.dorme={tipo:tipo,ef:ef,h:0,alvo:h,fim:!!encerra,ox:S.p.x,oy:S.p.y};
  if(tipo==='cama'){S.p.x=3.5;S.p.y=4.5}
  $('acorda').hidden=false;
  hud();infoAlvo();
}
function cair(){
  if(S.dorme)return;
  var noite=S.hora>=MIN_DIA;
  rota=null;fechar();
  S.dorme={tipo:'chao',ef:.7,h:0,alvo:noite?Math.max(1,(8-S.sonoHoje)/.7):4,fim:noite,ox:S.p.x,oy:S.p.y};
  $('acorda').hidden=true;
  toast('Você caiu de sono!');
}
function dormir(dt){
  var d=S.dorme,dh=dt*8/60;
  if(d.h+dh>=d.alvo)dh=d.alvo-d.h;
  d.h+=dh;S.hora+=dh*60;
  S.folego=Math.min(100,S.folego+dh*12.5*d.ef);S.sonoHoje+=dh*d.ef;
  hudT+=dt;if(hudT>.4){hudT=0;hud();infoAlvo()}
  if(d.h>=d.alvo-1e-6)acordar(false);
}
function acordar(manual){
  var d=S.dorme;if(!d)return;
  S.dorme=null;$('acorda').hidden=true;
  if(d.fim){novoDia(false);return}
  if(d.tipo==='cama'){S.p.x=2.5;S.p.y=4.5}else{S.p.x=d.ox;S.p.y=d.oy}
  toast('Você acordou. Dormiu '+fmtH(d.h)+' h.');
  hud();infoAlvo();
}

/* madeira e construções */
var OBRAS={cerca:{nome:'Cerca',custo:2,desc:'Delimita o terreno. Emenda sozinha com as vizinhas.'},banco:{nome:'Banco',custo:6,desc:'Sente e cochile: rende 60% do sono.'},galpao:{nome:'Galpão de ferramentas',custo:15,desc:'Todas as ferramentas gastam 1 de fôlego a menos.'}};

}
function colocar(tx,ty){
  var c=S.colocando,d=OBRAS[c];
  if(S.camada!=='sup'||tipo(tx,ty)!=='g'||(Math.floor(S.p.x)===tx&&Math.floor(S.p.y)===ty)){toast('Aqui não dá. Escolha um quadrado livre de grama.');return}
  if(S.madeira<d.custo){toast('Falta madeira.');S.colocando=null;return}
  S.madeira-=d.custo;S.obras.push({t:c,x:tx,y:ty});S.colocando=null;
  toast(d.nome+' construído.');hud();barra();guardar();
}
/* cachorro */
var CACAS={prea:{nome:'Preá',v:22},codorna:{nome:'Codorna',v:35},tatu:{nome:'Tatu',v:70}};
var cao={x:6.5,y:4.5,tx:6.5,ty:4.5,est:'passeia',t:0,cd:30,pausa:1,plot:-1,ang:0,mov:false,vis:false};
function caoTile(){return{x:Math.floor(cao.x),y:Math.floor(cao.y)}}
function passoCao(modo){
  var px=Math.floor(S.p.x),py=Math.floor(S.p.y),cx0=Math.floor(cao.x),cy0=Math.floor(cao.y),ds=[[1,0],[-1,0],[0,1],[0,-1]],op=[],i;
  for(i=0;i<4;i++){var nx=cx0+ds[i][0],ny=cy0+ds[i][1];if(anda(nx,ny)&&!(nx===px&&ny===py))op.push({x:nx,y:ny,d:Math.abs(nx-px)+Math.abs(ny-py)})}
  if(!op.length)return;
  var esc=op[Math.floor(Math.random()*op.length)];
  if(modo==='longe'){op.sort(function(a,b){return b.d-a.d});esc=op[0]}
  else if(S.cao.amizade>=4&&Math.hypot(cao.x-S.p.x,cao.y-S.p.y)>3.5&&Math.random()<.6){op.sort(function(a,b){return a.d-b.d});esc=op[0]}
  cao.tx=esc.x+.5;cao.ty=esc.y+.5;
}
function voltaCaca(){
  var c=S.cao,i;
  if(Math.random()<.2-c.amizade*.015){toast(S.nomes.cao+' voltou de mãos abanando.');return}
  var n=1+(Math.random()<.3+c.amizade*.05?1:0)+(c.amizade>=7&&Math.random()<.4?1:0),txt=[];
  for(i=0;i<n;i++){var r=Math.random(),k=r<.5?'prea':r<.85?'codorna':'tatu';S.caca[k]++;txt.push(CACAS[k].nome)}
  toast(S.nomes.cao+' voltou da caçada com: '+txt.join(', ')+'.');
}
function aplicaXixi(){
  var pl=S.plots[cao.plot];if(!pl)return;
  pl.xixi=true;if(!pl.c)return;
  var e=estagio(pl);
  if(e<=1){
    if(Math.random()<.6){toast(S.nomes.cao+' fez xixi e a muda morreu.');pl.c=null;pl.dr=0;pl.ad=null}
    else toast(S.nomes.cao+' fez xixi na muda, mas ela aguentou.');
  }else{pl.dr=Math.max(0,pl.dr-1);toast(S.nomes.cao+' fez xixi na planta: as folhas queimaram e ela cresceu menos.')}
}
function atualizaCao(dt){
  var c=S.cao;
  if(c.cacando){
    if(S.dia*10000+S.hora>=c.cacando.ate){c.cacando=null;cao.est='passeia';cao.x=14.5;cao.y=5.5;cao.tx=cao.x;cao.ty=cao.y;voltaCaca()}
    cao.vis=false;return;
  }
  cao.vis=S.camada==='sup';
  if(!cao.vis||S.dorme){cao.mov=false;return}
  cao.t-=dt;cao.cd-=dt;
  if(cao.est==='mija'){cao.mov=false;if(cao.t<=0){aplicaXixi();cao.est='passeia';cao.pausa=1;cao.cd=45+Math.random()*45}return}
  var sp=cao.est==='foge'?3.6:1.9,dx=cao.tx-cao.x,dy=cao.ty-cao.y,d=Math.hypot(dx,dy);
  if(cao.est==='foge'&&cao.t<=0)cao.est='passeia';
  if(d>.04){var st=Math.min(d,sp*dt);cao.x+=dx/d*st;cao.y+=dy/d*st;cao.ang=Math.atan2(dx,dy);cao.mov=true;return}
  cao.mov=false;cao.pausa-=dt;
  if(cao.pausa>0)return;
  var tl=caoTile(),pi=plotIdx(tl.x,tl.y);
  if(cao.est==='passeia'&&pi>=0&&S.plots[pi].c&&!S.plots[pi].xixi&&cao.cd<=0){
    var cercas=S.obras.filter(function(o){return o.t==='cerca'}).length,prot=Math.min(1,cercas/16)*.9;
    if(Math.random()<.3*(1-prot)*(1-c.amizade*.07)){cao.est='mija';cao.t=3;cao.plot=pi;cao.mov=false;toast(S.nomes.cao+' vai fazer xixi na horta! Toque nele para ralhar.');return}
  }
  passoCao(cao.est==='foge'?'longe':'normal');
  cao.pausa=cao.est==='foge'?0:.5+Math.random()*2.2;
}

  S.dia++;S.hora=0;S.plots.forEach(function(p){p.xixi=false});Object.keys(S.cortadas).forEach(function(k){if(S.dia>=S.cortadas[k]){delete S.cortadas[k];delete S.arv[k]}});
