<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dominó do Meladinha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dominó">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3b2896">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: mesa roxa em tela cheia (horizontal ou vertical) — jogadores em círculos nos quatro lados, corrente no centro, mão embaixo. */
:root{
  --felt:#2a1d6b; --felt-deep:#150d3a; --felt-lite:#4b3aa8;
  --ivory:#f6f0dc; --ivory-edge:#c9bd98; --pip:#1c1a16;
  --gold:#ecbd3f; --gold-deep:#a47a14; --brick:#ff5f7e; --ink:#f6f1ff; --mute:#b9b0e8;
  --sl:max(10px,env(safe-area-inset-left,0px)); --sr:max(10px,env(safe-area-inset-right,0px));
  --st:max(8px,env(safe-area-inset-top,0px)); --sb:max(8px,env(safe-area-inset-bottom,0px));
  --hh:clamp(68px,24vh,110px); --hb:var(--sb);
  --display:'Alfa Slab One','Rockwell','Georgia',serif;
  --body:'Barlow','Segoe UI','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--felt-deep);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0;
  user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 46%,#7258e0 0%,#4a35b0 42%,#241658 78%,#120a34 100%)}
#app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 0 3px rgba(140,190,255,.38),inset 0 0 70px rgba(120,160,255,.28),inset 0 0 170px rgba(8,4,36,.65)}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .25s;
  box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 36px 6px rgba(236,189,63,.65)}
#app.myturn::after{opacity:1;animation:pulsar 1.1s ease-in-out infinite}
@keyframes pulsar{0%,100%{opacity:.35}50%{opacity:1}}
h1,h2{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.02em}

/* menu e placar */
.menu{position:absolute;z-index:7;top:var(--st);left:calc(50% - 99px - 46px);width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(21,13,58,.78);font-size:18px}
#scorebox{position:absolute;z-index:4;top:var(--st);left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:3px 4px;width:198px}
#scorebox .team{flex:1 1 90px;min-width:0}
.team{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:6px;background:rgba(21,13,58,.78);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:2px 8px 4px}
.team .tn{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .pts{font-family:var(--display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.team .bar{grid-column:1/-1;height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.team .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s}
.team.b .bar i{background:var(--brick)}
.team.mine{border-color:var(--gold)}

/* jogadores */
.pl{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;width:96px}
.s-tl{left:var(--sl);top:var(--st)}
.s-tr{right:var(--sr);top:var(--st)}
.s-bl{left:var(--sl);bottom:var(--sb)}
.s-br{right:var(--sr);bottom:var(--sb)}
.av{position:relative;width:54px;height:54px;border-radius:50%;padding:3px;background:rgba(255,255,255,.24)}
.av .face{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c,#6a55d8);
  font-family:var(--display);font-size:22px;color:#fff;box-shadow:inset 0 -7px 12px rgba(0,0,0,.28)}
.pl.turn .av{background:conic-gradient(var(--gold) calc(var(--p,1)*360deg),rgba(255,255,255,.2) 0);box-shadow:0 0 16px rgba(236,189,63,.75)}
.pl.turn.low .av{background:conic-gradient(var(--brick) calc(var(--p,1)*360deg),rgba(255,255,255,.2) 0)}
.cnt{position:absolute;top:-3px;right:-9px;min-width:22px;height:28px;border-radius:5px;background:var(--ivory);color:#1c1a16;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.plate{max-width:100%;background:rgba(21,13,58,.82);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:1px 8px 2px;text-align:center}
.plate .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate small{display:block;font-size:10px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.plate .sec{display:none;color:var(--gold);font-variant-numeric:tabular-nums}
.pl.timing .plate .role{display:none}
.pl.timing .plate .sec{display:block}
.pl.low .plate .sec{color:var(--brick)}
.pl.mate .plate .nm{color:var(--gold)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.bubble{position:absolute;font-size:34px;pointer-events:none;animation:subir 2.6s ease-out forwards;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
@keyframes subir{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px) scale(1)}}

/* corrente */
#center{position:absolute;z-index:2;left:var(--sl);right:calc(var(--sr) + 58px);top:calc(var(--st) + 100px);bottom:calc(var(--hb) + var(--hh) + 26px)}
.ends{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute);flex-wrap:wrap;background:rgba(21,13,58,.78);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:1px 8px}
.ends:empty{display:none}
.ends b{color:var(--gold);font-family:var(--display);font-weight:400;font-size:14px}
#board{position:absolute;inset:0}
.wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:0 16px;font-size:15px}
#status{position:absolute;z-index:4;left:calc(var(--sl) + 106px);right:calc(var(--sr) + 106px);bottom:calc(var(--hb) + var(--hh) + 4px);text-align:center;font-weight:600;font-size:14px;line-height:1.2;pointer-events:none;text-shadow:0 1px 4px #000,0 0 8px rgba(0,0,0,.7)}
#status.you{color:var(--gold)}

/* peças */
.pc{display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.pc-body{fill:var(--ivory);stroke:var(--ivory-edge);stroke-width:1.5}
.pc-div{stroke:#8d8366;stroke-width:1.6;stroke-linecap:round}
.pc-pip{fill:var(--pip)}
.pc-hub{fill:var(--gold-deep)}

/* mão numa bandeja iluminada */
#handwrap{position:absolute;z-index:4;left:calc(var(--sl) + 106px);right:calc(var(--sr) + 106px);bottom:var(--hb);height:var(--hh);
  display:flex;align-items:flex-end;justify-content:center;padding:0 10px 6px;border-radius:14px 14px 4px 4px;
  background:linear-gradient(180deg,rgba(120,150,255,.04),rgba(110,140,255,.36));border:1px solid rgba(160,190,255,.35);border-bottom:0;box-shadow:0 -6px 22px rgba(110,140,255,.3)}
#hand{display:flex;justify-content:center;align-items:flex-end;gap:5px;width:100%}
.hp{background:none;border:0;padding:0;border-radius:8px;transition:transform .15s}
.hp.ok{transform:translateY(-10px);filter:drop-shadow(0 0 7px rgba(236,189,63,.95))}
.hp.no{opacity:.5}
.hp.back i{display:block;border-radius:6px;background:linear-gradient(#e2b24a,#a47a14);border:1px solid #6d5009}
.backs{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;max-width:96px}
.backs i{width:7px;height:13px;border-radius:2px;background:linear-gradient(#e2b24a,#a47a14);border:1px solid #6d5009}
.tag{position:absolute;left:50%;top:44px;transform:translateX(-50%);padding:0 9px;border-radius:4px;background:#ff8a1f;color:#2b1200;font-weight:700;font-size:11px;letter-spacing:.06em;z-index:5;animation:entrar .25s ease-out}
@keyframes entrar{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.pop{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:24px;color:var(--gold);text-shadow:0 2px 6px #000;white-space:nowrap;pointer-events:none;animation:subir 2.8s ease-out forwards;z-index:9}
#waiting{position:absolute;z-index:5;left:0;top:42%;padding:8px 30px 8px 18px;background:linear-gradient(90deg,rgba(170,30,70,.94),rgba(70,25,120,.55));color:#fff;font-weight:700;font-size:15px;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);animation:deslizar .4s ease-out}
#waiting[hidden]{display:none}
@keyframes deslizar{from{transform:translateX(-100%)}to{transform:none}}
#acts{position:absolute;z-index:7;right:var(--sr);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;align-items:center}
.act{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(21,13,58,.82);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.act b{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--brick);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.act[hidden],.act b[hidden]{display:none}
#emojis{position:absolute;z-index:8;right:calc(var(--sr) + 58px);top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border-radius:14px;background:rgba(21,13,58,.95);border:1px solid rgba(255,255,255,.3);box-shadow:0 6px 20px rgba(0,0,0,.5)}
#emojis[hidden]{display:none}
#emojis button{width:44px;height:44px;border:0;background:transparent;font-size:26px;border-radius:10px;padding:0}
#emojis button:active{background:rgba(255,255,255,.2)}

/* camadas */
.layer{position:fixed;inset:0;background:rgba(12,7,36,.9);display:flex;align-items:center;justify-content:center;z-index:10;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--felt);border:1px solid var(--felt-lite);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:26px;color:var(--gold)}
.card p{margin:0;line-height:1.35;color:var(--ink)}
.btn{min-height:48px;border-radius:12px;border:0;background:var(--gold);color:#2b2005;font-weight:700;font-size:17px;padding:0 18px;box-shadow:0 3px 0 var(--gold-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--felt-lite);box-shadow:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:120px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* configuração */
.seat{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--felt-deep);border-radius:10px;padding:8px 10px}
.seat label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);grid-column:1/-1}
.seat label em{font-style:normal;color:var(--gold)}
.seat label em.b{color:var(--brick)}
.seat input{min-width:0;height:40px;border-radius:8px;border:1px solid var(--felt-lite);background:var(--felt);color:var(--ink);padding:0 10px;font:inherit;font-size:16px}
.seg{display:flex;border:1px solid var(--felt-lite);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;height:40px;padding:0 12px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--gold);color:#2b2005}
.seg button:disabled{opacity:.8}

/* resultado */
.big{font-family:var(--display);font-size:34px;color:var(--gold);line-height:1.05}
.big.bad{color:var(--brick)}
.hands{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:8px;background:var(--felt-deep);border-radius:8px;padding:6px 8px}
.hrow .hn{flex:0 0 78px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hp2{flex:1;display:flex;gap:3px;flex-wrap:wrap;min-height:20px}
.hrow .hs{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.rules{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:15px}
.rules b{font-family:var(--display);font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--mute)}
input{user-select:text;-webkit-user-select:text}
.ends .mt{margin-left:6px;color:var(--gold);font-weight:700}
#leave[hidden]{display:none}
#toasts{position:fixed;z-index:25;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  top:calc(var(--st) + 90px);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;max-width:520px;width:100%;background:var(--gold);color:#2b2005;border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.25;
  box-shadow:0 4px 14px rgba(0,0,0,.5);overflow-wrap:anywhere;animation:slidein .25s ease-out}
.toast b{font-weight:700;margin-right:6px}
@keyframes slidein{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.snake{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.snake .pc{position:absolute;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.pc.last .pc-body{stroke:var(--gold);stroke-width:3.5}
.snake .pc.last{animation:pop .5s ease-out;filter:drop-shadow(0 0 7px rgba(236,189,63,.95))}
@keyframes pop{0%{transform:scale(1.5);opacity:.2}60%{transform:scale(.94)}100%{transform:scale(1);opacity:1}}

/* conta, ranking e chat */
.me{display:flex;align-items:baseline;justify-content:space-between;gap:8px;background:var(--felt-deep);border-radius:10px;padding:10px 12px}
.me strong{font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold);min-width:0;overflow:hidden;text-overflow:ellipsis}
.me span{font-size:13px;color:var(--mute);text-align:right}
.rank{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rank td,.rank th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--felt-lite);font-size:15px}
.rank th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rank td:first-child,.rank th:first-child{width:34px;color:var(--mute)}
.rank td:nth-child(n+3),.rank th:nth-child(n+3){text-align:right}
.rank tr.me2 td{color:var(--gold);font-weight:700}
.mesas{display:flex;flex-direction:column;gap:6px}
.mesa{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--felt-deep);border-radius:10px;padding:8px 10px}
.mesa .mi{min-width:0;font-size:15px}
.mesa .mi small{display:block;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.mesa .mb{display:flex;gap:6px;flex:0 0 auto}
.mesa .btn{flex:0 0 auto;min-width:72px;min-height:40px;padding:0 12px;font-size:15px}
#rkbox:empty{display:none}
#rkbox{display:flex;flex-direction:column;gap:6px;background:var(--felt-deep);border-radius:10px;padding:8px 10px}
.rkhead{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rklink{background:none;border:0;color:var(--gold);font-size:13px;font-weight:700;padding:4px 0;text-decoration:underline}
#rkbox .me{background:var(--felt);padding:6px 10px}
#rkbox .rank td,#rkbox .rank th{padding:4px 6px;font-size:14px}
.err{color:#ff9d85;font-size:14px;min-height:18px;margin:0}
#chat{position:fixed;inset:0;z-index:30;background:rgba(12,7,36,.95);display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#chat[hidden]{display:none}
#chat .ch{display:flex;align-items:center;justify-content:space-between;max-width:520px;width:100%;margin:0 auto 8px}
#chat .ch h2{font-size:22px;color:var(--gold)}
#chatlist{flex:1;min-height:0;overflow:auto;max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:4px 0;user-select:text;-webkit-user-select:text}
.msg{background:var(--felt);border-radius:10px;padding:6px 10px;max-width:86%;align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--felt-lite)}
.msg small{display:block;font-size:11px;font-weight:700;color:var(--gold)}
.chatrow{display:flex;gap:8px;max-width:520px;width:100%;margin:8px auto 0}
.chatrow input{flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid var(--felt-lite);background:var(--felt);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.chatrow .btn{min-width:84px;flex:0 0 auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* o jogo é na horizontal: com o celular em pé a mesa fica coberta por um aviso para girar (as telas de menu, login e ranking continuam normais) */
#girar{display:none;position:fixed;inset:0;z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;color:#fff;
  background:radial-gradient(ellipse at 50% 45%,#6c54da 0%,#3b2896 55%,#150d3a 100%);font-family:var(--display);font-size:22px}
#girar p{margin:0;max-width:300px;line-height:1.25}
#girar small{font-family:var(--body);font-size:14px;color:var(--mute)}
.fone{width:44px;height:78px;border:4px solid #fff;border-radius:10px;position:relative;animation:girarfone 2.6s ease-in-out infinite}
.fone::after{content:'';position:absolute;left:50%;bottom:5px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:#fff}
@keyframes girarfone{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.playing #girar{display:flex}}
</style>

<div id="app">
  <button class="menu" id="btnMenu" aria-label="Menu">☰</button>
  <div id="scorebox"><div class="team a" id="tA"></div><div class="team b" id="tB"></div><div class="ends" id="ends"></div></div>
  <div id="seats"></div>
  <div id="center"><div id="board"></div></div>
  <div id="status"></div>
  <div id="handwrap"><div id="hand"></div></div>
  <div id="acts">
    <button class="act" id="btnEmoji" hidden aria-label="Emojis">😀</button>
    <button class="act" id="btnChat" hidden aria-label="Chat">💬<b id="cbadge" hidden>0</b></button>
  </div>
  <div id="emojis" hidden>
    <button data-e="😀">😀</button><button data-e="😂">😂</button><button data-e="😎">😎</button><button data-e="😡">😡</button><button data-e="😭">😭</button>
    <button data-e="👏">👏</button><button data-e="👍">👍</button><button data-e="🔥">🔥</button><button data-e="🤔">🤔</button><button data-e="🙏">🙏</button>
  </div>
  <div id="fx"></div>
</div>
<div id="girar"><div class="fone"></div><p>Gire o celular para jogar</p><small>A mesa é na horizontal. Se a tela não girar, ligue a rotação automática do celular.</small></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>
<div id="leave" class="layer" hidden style="z-index:40">
  <div class="card"><h2>Sair do jogo?</h2><p id="leavetxt"></p>
    <div class="btns"><button class="btn" id="lcont">Continuar jogando</button><button class="btn ghost" id="lout">Sair</button></div></div>
</div>

  <div class="ch"><h2>Bate-papo</h2><button class="btn ghost" id="chatClose" style="min-height:40px">Fechar</button></div>
  <div id="chatlist"></div>
  <form class="chatrow" id="chatform"><input id="chatin" maxlength="200" autocomplete="off" placeholder="Escreva uma mensagem" aria-label="Mensagem"><button class="btn" type="submit">Enviar</button></form>

<script>
(function(){
'use strict';
var TARGET=200,TURN_MS=20000,BOT_MS=1800,PASS_MS=1600,TURN=null,ME=null,CHAT=[],unread=0,chatOpen=false;
var SCORE={fechou:40,chorou:80,simples:20,buxa:30,buxaDobrada:60,lasquinePreso:60,lasquineSolto:30};
var $=function(id){return document.getElementById(id)};
/* Os robôs recebem nomes de personagens (ex.: "Goku Robô"), sorteados a cada partida entre os que ninguém está usando. */
var BOTS=['Goku','Vegeta','Piccolo','Gohan','Kuririn','Bulma','Trunks','Freeza','Cell','Majin Boo','Mestre Kame','Yamcha','Tenshinhan','Goten'].map(function(n){return n+' Robô'});
function isBotName(n){return /^(Robô|Parceiro Robô|Robô Adversário)/.test(n)||BOTS.indexOf(n)>=0}
function pickBot(used){
  var free=BOTS.filter(function(n){return used.indexOf(n)<0});
  var pool=free.length?free:BOTS;
  return pool[Math.floor(Math.random()*pool.length)];
}
var CFG={names:['Você','Vegeta Robô','Goku Robô','Freeza Robô'],human:[true,false,false,false]};
try{
  var sv=JSON.parse(localStorage.getItem('domino-cfg')||'null');
  if(sv&&sv.names&&sv.human){
    CFG=sv;CFG.human[0]=true;
    var DEF=['Você','Vegeta Robô','Goku Robô','Freeza Robô'];
    for(var q=1;q<4;q++)if(/^(Robô|Parceiro Robô|Robô Adversário)/.test(CFG.names[q]))CFG.names[q]=DEF[q];   // nomes antigos viram personagens
  }
}catch(e){}
var G=null;
var NP=4,LOCALNP=(function(){try{return localStorage.getItem('domino-np')==='2'?2:4}catch(e){return 4}})(),ONLINE=false,WATCH=false,MYSEAT=0,IAMHOST=false,ROOM=null,ROOMREF=null,REV=0,DB=null,UID=null,UNSUB=null,SAVED=null,MYNAME='',shownHand=-1;

/* ---------- peças ---------- */
function pips(n){
  var p=[[13,13],[25,13],[37,13],[13,25],[25,25],[37,25],[13,37],[25,37],[37,37]];
  var m={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  return m[n].map(function(i){return p[i]});
}
function svgPiece(a,b,vert,w,h,extra,css){
  var W=vert?50:100,H=vert?100:50,s='<svg class="pc '+(extra||'')+'" viewBox="0 0 '+W+' '+H+'" style="width:'+w+'px;height:'+h+'px;'+(css||'')+'" aria-hidden="true">';
  s+='<rect class="pc-body" x="1" y="1" width="'+(W-2)+'" height="'+(H-2)+'" rx="5"/>';
  s+=vert?'<line class="pc-div" x1="7" y1="50" x2="43" y2="50"/>':'<line class="pc-div" x1="50" y1="7" x2="50" y2="43"/>';
  [[a,0,0],[b,vert?0:50,vert?50:0]].forEach(function(h2){
    pips(h2[0]).forEach(function(q){s+='<circle class="pc-pip" cx="'+(q[0]+h2[1])+'" cy="'+(q[1]+h2[2])+'" r="4.6"/>'});
  });
  return s+'</svg>';
}
function key(p){return p.a+'-'+p.b}

/* ---------- regras ---------- */
/* NP é o número de jogadores: 4 (duplas, cadeiras 0 a 3) ou 2 (um contra um, cadeiras 0 e 2, uma de frente para a outra). */
function team(s){return NP===2?(s>>1):s%2}
function nextSeat(s){return NP===2?(s+2)%4:(s+1)%4}
function activeSeats(){return NP===2?[0,2]:[0,1,2,3]}
function ends(){return G.chain.length?[G.chain[0].a,G.chain[G.chain.length-1].b]:null}
function legalMoves(s){
  var hand=G.hands[s],mv=[],e=ends();
  if(!e){
    hand.forEach(function(p){if(!G.must||key(p)===key(G.must))mv.push({p:p,side:'c'})});
    return mv;
  }
  var L=e[0],R=e[1];
  hand.forEach(function(p){
    var cl=p.a===L||p.b===L,cr=p.a===R||p.b===R;
    if(cr)mv.push({p:p,side:'R'});
    if(cl&&!(cr&&L===R))mv.push({p:p,side:'L'});
  });
  return mv;
}
/* Pontos da batida. p é a última peça, L e R as pontas antes dela, left quantas peças com esses números ainda estão nas mãos dos outros. */
function batida(p,L,R,left){
  var best={pts:SCORE.simples,name:'Batida simples'};
  function up(pts,name){if(pts>best.pts)best={pts:pts,name:name}}
  if(p.a===0||p.b===0)up(SCORE.buxa,'Batida de buxa');                 // buxa = o branco
  if(p.a===0&&p.b===0)up(SCORE.buxaDobrada,'Batida de buxa dobrada');   // o 0|0
  // Lasquinê: a peça [L,R], de pontas diferentes, serve nas duas pontas.
  if(L!==R&&((p.a===L&&p.b===R)||(p.a===R&&p.b===L))){
    if(left>0)up(SCORE.lasquineSolto,'Lasquinê solto');
    else up(SCORE.lasquinePreso,'Lasquinê preso');
  }
  return best;
}
function restantes(s,L,R){
  var n=0;
  function hit(q){if(q.a===L||q.b===L||q.a===R||q.b===R)n++}
  for(var o=0;o<4;o++)if(o!==s)G.hands[o].forEach(hit);
  if(NP===2)G.monte.forEach(hit);
  return n;
}
function pipsOf(h){return h.reduce(function(t,p){return t+p.a+p.b},0)}
function isClosed(){
  var e=ends();if(!e)return false;
  if(NP===2&&G.monte.length)return false;   // no 1x1, quem trava ainda compra do monte
  for(var s=0;s<4;s++)for(var i=0;i<G.hands[s].length;i++){var p=G.hands[s][i];
    if(p.a===e[0]||p.b===e[0]||p.a===e[1]||p.b===e[1])return false}
  return true;
}
function nm(s){return CFG.names[s]||('Jogador '+(s+1))}
function myTeam(){return ONLINE&&MYSEAT>=0?team(MYSEAT):0}
function teamName(t){
  if(NP===2)return nm(t*2);
  return humanCount()>1||WATCH?('Dupla '+(t?'B':'A')):(t===myTeam()?'Nós':'Eles');
}
function dupla(t){
  if(NP===2)return nm(t*2);
  return humanCount()>1||WATCH?('a Dupla '+(t?'B':'A')):(t===myTeam()?'a nossa dupla':'a dupla adversária');
}
function venceu(t){
  if(NP===2)return (humanCount()===1&&!WATCH&&t===myTeam())?'Você venceu!':nm(t*2)+' venceu!';
  return humanCount()>1||WATCH?('A Dupla '+(t?'B':'A')+' venceu!'):(t===myTeam()?'Nós vencemos!':'Eles venceram!');
}
function humanCount(){return ONLINE?1:CFG.human.filter(Boolean).length}
function resText(r){
  var n=nm(r.seat);
  if(r.kind==='batida')return n+' bateu e levou '+r.points+' pontos para '+dupla(r.winner)+'.';
  if(r.kind==='empate')return 'Os dois lados ficaram com '+r.tp[0]+' pontos nas peças. Ninguém marca e a próxima mão sai com a buxa de sena (0|6).';
  return n+' fechou o jogo com '+r.tp[r.ct]+' contra '+r.tp[1-r.ct]+'. Marca '+r.points+' para '+dupla(r.winner)+'.';
}

/* ---------- partida ---------- */
/* Avisa o servidor se estou jogando uma partida só minha (contra robôs) ou no menu, para aparecer em "Jogando agora". */
function presenca(modo){try{if(DB&&DB.send&&!viaClaude())DB.send({t:'presence',mode:modo})}catch(e){}}
function newGame(){
  if(!ONLINE)presenca('local');
  G={scores:[0,0],hands:[[],[],[],[]],monte:[],chain:[],turn:0,passed:[[],[],[],[]],passes:0,
     gameId:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tie:false,handNo:0,res:null,first:true,nextStarter:0,must:null,handOver:false,over:false,viewer:0,msg:'',token:0,cover:false,lastPlayer:0,lastPiece:null};
  for(var i=0;i<4;i++)G.passed[i]=[];
  armBackGuard();
  newHand();
}
function newHand(){
  var deck=[];for(var a=0;a<=6;a++)for(var b=a;b<=6;b++)deck.push({a:a,b:b});
  for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=deck[i];deck[i]=deck[j];deck[j]=t}
  // Duplas: 6 peças cada e 4 dormem. Um contra um: 7 peças cada e 14 ficam no monte para comprar.
  var hs=NP===2?7:6;
  G.hands=[0,1,2,3].map(function(s){
    if(NP===2&&(s===1||s===3))return [];
    var k=NP===2?(s>>1):s;
    return deck.slice(k*hs,k*hs+hs).sort(function(x,y){return x.a-y.a||x.b-y.b});
  });
  G.monte=NP===2?deck.slice(14):[];
  G.chain=[];G.passed=[[],[],[],[]];G.passes=0;G.handOver=false;G.token++;G.lastPiece=null;G.res=null;G.handNo++;
  if(G.first){
    var best=null,seat=0;
    G.hands.forEach(function(h,s){h.forEach(function(p){
      var sc=(p.a===p.b?100:0)+p.a+p.b;
      if(!best||sc>best.sc){best={sc:sc,p:p};seat=s}
    })});
    G.must=best.p;G.turn=seat;
    G.msg=nm(seat)+' começa com a '+best.p.a+'|'+best.p.b+'.';
  }else if(G.tie){
    G.tie=false;G.must=null;
    var holder=-1;
    G.hands.forEach(function(h,s){h.forEach(function(p){if(p.a===0&&p.b===6){holder=s;G.must=p}})});
    if(holder>=0){G.turn=holder;G.msg=nm(holder)+' começa com a buxa de sena (0|6).'}
    else{G.turn=G.nextStarter;G.msg='A buxa de sena dormiu. '+nm(G.turn)+' começa a mão.'}
  }else{
    G.must=null;G.turn=G.nextStarter;G.msg=nm(G.turn)+' começa a mão.';
  }
  closeLayer();render();
  step();
}
function step(remote){
  disarmTurn();
  if(!G||G.handOver||G.over)return;
  var s=G.turn,tok=G.token;
  if(ONLINE&&!remote)pushState();
  render();
  var moves=legalMoves(s);
  function autoPass(){
    var buy=NP===2&&G.monte.length>0;
    G.msg=nm(s)+(buy?' não tem peça e compra do monte.':' não tem peça e passa.');render();
    setTimeout(function(){if(G&&G.token===tok&&G.turn===s&&!G.handOver){if(buy)doDraw(s);else doPass(s)}},PASS_MS);
  }
  function bot(){
    armTurn(s,tok,false);
    setTimeout(function(){if(G&&G.token===tok&&G.turn===s&&!G.handOver&&!G.over)botPlay(s)},BOT_MS);
  }
  if(ONLINE){
    if(s===MYSEAT){
      if(!moves.length)autoPass();else armTurn(s,tok,true);
    }else if(!CFG.human[s]){
      if(IAMHOST)bot();else armTurn(s,tok,false);
    }else armTurn(s,tok,false);
    return;
  }
  if(CFG.human[s]){
    if(humanCount()>1&&G.viewer!==s){showCover(s);return}
    if(!moves.length)autoPass();else armTurn(s,tok,true);
  }else bot();
}
/* Relógio da jogada: 20 s. Quem deve jogar tem a pedra lançada sozinha (escolha do robô) se o tempo acabar.
   No online o anfitrião cobre quem sumiu, 3 s depois do prazo. */
function armTurn(s,tok,mine){
  var grace=mine?0:(ONLINE&&IAMHOST&&CFG.human[s]?3000:-1);
  TURN={s:s,tok:tok,end:Date.now()+TURN_MS,fired:false,grace:grace,timer:null,mine:!!mine,warned:false};
  var t=TURN;
  t.timer=setInterval(function(){
    if(!G||TURN!==t||G.token!==t.tok||G.handOver){disarmTurn();return}
    var left=t.end-Date.now();
    drawTurn(left);
    if(t.mine&&!t.warned&&left<5000){t.warned=true;beep([880,880],0.1)}   // últimos 5 segundos: bipe duplo
    if(left<=-Math.max(t.grace,0)&&t.grace>=0&&!t.fired){t.fired=true;autoPlay(t.s)}
  },200);
  drawTurn(TURN_MS);
  if(mine)alertTurn();
}
function disarmTurn(){
  if(TURN&&TURN.timer)clearInterval(TURN.timer);
  TURN=null;
  document.querySelectorAll('.pl.timing').forEach(function(e){e.classList.remove('timing','low')});
}
/* Anel de tempo em volta do avatar de quem está na vez e os segundos na plaquinha. */
function drawTurn(left){
  var el=document.querySelector('.pl.turn');if(!el)return;
  var l=Math.max(0,left);
  el.style.setProperty('--p',(l/TURN_MS).toFixed(3));
  el.classList.add('timing');
  el.classList.toggle('low',l<5000);
  var sec=el.querySelector('.sec');if(sec)sec.textContent=Math.ceil(l/1000)+' s';
}
/* Alerta de "sua vez": bipe, vibração e, com a aba em segundo plano, aviso no título. A borda dourada pulsando vem do CSS (classe myturn). */
var SOUND=(function(){try{return localStorage.getItem('domino-som')!=='0'}catch(e){return true}})(),AC=null,TITLE0=document.title;
function beep(freqs,dur){
  if(!SOUND)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var t0=AC.currentTime;
    freqs.forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain(),t=t0+i*(dur+0.05);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.28,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.03);
    });
  }catch(e){}
}
/* Duas batidas na mesa ("toc toc") quando alguém passa: um baque grave que cai de tom, mais um estalo curto de ruído. */
function knock(){
  if(!SOUND)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var len=Math.floor(AC.sampleRate*0.04),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    [0,0.17].forEach(function(dt){
      var t=AC.currentTime+dt;
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(70,t+0.11);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.9,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.16);
      var n=AC.createBufferSource(),ng=AC.createGain(),f=AC.createBiquadFilter();
      f.type='lowpass';f.frequency.value=1400;ng.gain.value=0.45;
      n.buffer=buf;n.connect(f);f.connect(ng);ng.connect(AC.destination);n.start(t);
    });
  }catch(e){}
}
function alertTurn(){
  beep([660,990],0.14);
  try{if(SOUND&&navigator.vibrate)navigator.vibrate([140,70,140])}catch(e){}
  if(document.hidden)document.title='▶ Sua vez! · '+TITLE0;
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)document.title=TITLE0});
function autoPlay(s){
  if(!G||G.handOver||G.turn!==s)return;
  var moves=legalMoves(s);
  if(!moves.length)return;
  closeLayer();
  doMove(s,botChoose(s,moves),true);
}
function botPlay(s){
  var moves=legalMoves(s);
  if(!moves.length){if(NP===2&&G.monte.length)doDraw(s);else doPass(s);return}
  doMove(s,botChoose(s,moves));
}
function doDraw(s){
  G.hands[s].push(G.monte.pop());
  G.hands[s].sort(function(x,y){return x.a-y.a||x.b-y.b});
  G.msg=nm(s)+' comprou uma peça (monte: '+G.monte.length+').';
  step();
}
function exhausted(v,chain){
  var n=0;chain.forEach(function(p){if(p.a===v||p.b===v)n++});return n>=7;
}
function botChoose(s,moves){
  var hand=G.hands[s],e=ends(),partner=NP===2?-1:(s+2)%4,opp=NP===2?[(s+2)%4]:[(s+1)%4,(s+3)%4],best=null,bs=-1e9;
  moves.forEach(function(m){
    var p=m.p,nl,nr,sc=Math.random()*1.2;
    if(m.side==='c'){nl=p.a;nr=p.b}
    else if(m.side==='L'){nl=p.b===e[0]?p.a:p.b;nr=e[1]}
    else{nl=e[0];nr=p.a===e[1]?p.b:p.a}
    var rest=hand.filter(function(x){return x!==p});
    if(!rest.length){
      var info=batida(p,e?e[0]:0,e?e[1]:0,1);sc+=1000+info.pts;   // o robô não vê as mãos: supõe que ainda sobram peças
    }else{
      sc+=(p.a+p.b)*0.6+(p.a===p.b?2:0);
      var cnt=function(v){return rest.filter(function(x){return x.a===v||x.b===v}).length};
      sc+=(cnt(nl)+cnt(nr))*1.5;
      [nl,nr].forEach(function(v){
        opp.forEach(function(o){if(G.passed[o].indexOf(v)>=0)sc+=4});
        if(partner>=0&&G.passed[partner].indexOf(v)>=0)sc-=3;
      });
      var nc=G.chain.concat([p]);
      if(exhausted(nl,nc)&&exhausted(nr,nc)){
        var mine=pipsOf(rest);
        sc+=mine<=10?25:-mine*1.5;
      }
    }
    if(sc>bs){bs=sc;best=m}
  });
  return best;
}
function orient(p,side,e){
  if(side==='c')return {a:p.a,b:p.b};
  if(side==='L')return p.b===e[0]?{a:p.a,b:p.b}:{a:p.b,b:p.a};
  return p.a===e[1]?{a:p.a,b:p.b}:{a:p.b,b:p.a};
}
function doMove(s,m,auto){
  var e=ends(),p=m.p,np=orient(p,m.side,e);
  var info=e?batida(p,e[0],e[1],restantes(s,e[0],e[1])):null;
  G.hands[s]=G.hands[s].filter(function(x){return x!==p});
  if(m.side==='L')G.chain.unshift(np);else G.chain.push(np);
  G.must=null;G.first=false;G.passes=0;G.lastPlayer=s;G.lastPiece=np;
  G.msg=nm(s)+' jogou '+p.a+'|'+p.b+(auto?' (tempo esgotado, jogada automática).':'.');
  if(!G.hands[s].length){endHand({type:'batida',seat:s,info:info});return}
  if(isClosed()){endHand({type:'fechou',seat:s});return}
  G.turn=nextSeat(s);
  step();
}
function doPass(s){
  var e=ends();
  if(e){G.passed[s].push(e[0]);G.passed[s].push(e[1])}
  G.passes++;G.msg=nm(s)+' passou.';
  G.pk=(G.pk||0)+1;G.lastPass={s:s,k:G.gameId+'-'+G.handNo+'-'+G.pk};   // faz aparecer a etiqueta PASSOU perto do avatar
  if(G.passes>=NP){endHand({type:'fechou',seat:G.lastPlayer});return}
  G.turn=nextSeat(s);
  step();
}
function endHand(r){
  G.handOver=true;G.token++;
  var res={hands:G.hands.map(function(h){return h.slice()}),pips:G.hands.map(pipsOf)};
  if(r.type==='batida'){
    res.winner=team(r.seat);res.points=r.info.pts;res.title=r.info.name;res.kind='batida';res.seat=r.seat;
    G.nextStarter=r.seat;
  }else{
    var tp=[0,0];for(var s=0;s<4;s++)tp[team(s)]+=res.pips[s];
    var ct=team(r.seat);res.tp=tp;res.ct=ct;res.seat=r.seat;
    if(tp[0]===tp[1]){
      res.winner=-1;res.points=0;res.title='Fechou empatado';res.kind='empate';
      G.tie=true;   // empate: a próxima mão sai com a buxa de sena (0|6)
    }else if(tp[ct]<tp[1-ct]){
      res.winner=ct;res.points=SCORE.fechou;res.title='Fechou e ganhou';res.kind='ganhou';
      G.nextStarter=r.seat;
    }else{
      res.winner=1-ct;res.points=SCORE.chorou;res.bad=true;res.title='Fechou e chorou';res.kind='chorou';
      G.nextStarter=nextSeat(r.seat);
    }
  }
  if(res.winner>=0)G.scores[res.winner]+=res.points;
  if(res.winner>=0&&G.scores[res.winner]>=TARGET){G.over=true;res.final=res.winner}
  G.res=res;
  if(ONLINE){shownHand=G.handNo;pushState()}else reportResult(res);
  render();
  setTimeout(function(){showResult(res)},2200);
}

/* ---------- interface ---------- */
/* Partida local (contra robôs ou no mesmo celular) que chegou ao fim: quem está com a conta ganha vitória ou derrota no ranking. */
var RANKNOTE='';
/* Saiu de uma partida local antes de terminar: conta um abandono para quem está com a conta. */
function reportAbandon(){
  if(ONLINE||!G||G.over||!ME||ME.guest||!DB||viaClaude()||!DB.send||!G.handNo)return;
  DB.raw({t:'abandon',gameId:G.gameId}).then(function(r){ME.abandons=r.abandons||0}).catch(function(){});
}

/* Corrente em serpentina com posições exatas: cada linha começa onde a anterior terminou, então as pedras ficam coladas. */
function renderBoard(){
  var el=$('board');
  if(!G.chain.length){el.innerHTML='<div class="wait">Mesa vazia. Quem começa joga a primeira peça.</div>';return}
  var W=Math.floor(el.clientWidth-8),H=Math.floor(el.clientHeight-4),gap=2;
  // Procura a maior pedra com que a corrente inteira cabe na área da mesa (largura e altura).
  function disposicao(u){
    var rows=[{dir:1,pcs:[],dbl:false}],x=0,dir=1;
    G.chain.forEach(function(p){
      var d=p.a===p.b,w=d?u:2*u,row=rows[rows.length-1];
      var fits=dir===1?x+w<=W:x-w>=0;
      if(!fits&&row.pcs.length){dir=-dir;row={dir:dir,pcs:[],dbl:false};rows.push(row)}
      var left;
      if(dir===1){left=x;x+=w}else{x-=w;left=Math.max(0,x)}
      row.pcs.push({p:p,left:left,w:w,d:d,rev:dir===-1});
      if(d)row.dbl=true;
    });
    var tot=0;rows.forEach(function(r){tot+=(r.dbl?2*u:u)+gap});
    return {rows:rows,h:tot-gap};
  }
  var u=Math.min(44,Math.max(14,Math.floor(W/12))),lay=disposicao(u);
  while(lay.h>H&&u>14){u-=2;lay=disposicao(u)}
  var rows=lay.rows;
  var shift=0;
  if(rows.length===1){var pcs=rows[0].pcs;shift=Math.floor((W-(pcs[pcs.length-1].left+pcs[pcs.length-1].w-pcs[0].left))/2)-pcs[0].left}
  var y=0,html='',lp=G.lastPiece;
  rows.forEach(function(r){
    var rh=r.dbl?2*u:u;
    r.pcs.forEach(function(q){
      var h=q.d?2*u:u,css='left:'+(q.left+shift)+'px;top:'+(y+(rh-h)/2)+'px;';
      var isLast=lp&&((q.p.a===lp.a&&q.p.b===lp.b)||(q.p.a===lp.b&&q.p.b===lp.a));
      var cls=isLast?'last':'';
      if(q.d)html+=svgPiece(q.p.a,q.p.b,true,u,2*u,cls,css);
      else html+=svgPiece(q.rev?q.p.b:q.p.a,q.rev?q.p.a:q.p.b,false,2*u,u,cls,css);
    });
    y+=rh+gap;
  });
  el.innerHTML='<div class="snake" style="width:'+W+'px;height:'+lay.h+'px">'+html+'</div>';
}

/* Fora do claude.ai o banco é um servidor próprio por WebSocket (pasta domino-online), com a mesma interface doc/get/set/update/delete/onSnapshot. */
function netDB(){if(!DB){DB=makeWsDB();DB.onchat=onChat}return DB}
function getToken(){try{return localStorage.getItem('domino-token')||''}catch(e){return ''}}
function setToken(t){try{if(t)localStorage.setItem('domino-token',t);else localStorage.removeItem('domino-token')}catch(e){}}
function makeWsDB(){
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host,sock=null,open=false,queue=[],pending={},nid=1,subs={},closed=false,api;
  function tx(o){var s=JSON.stringify(o);if(open)sock.send(s);else queue.push(s)}
  function rpc(o){return new Promise(function(res,rej){var id=nid++;pending[id]={res:res,rej:rej};o.id=id;tx(o)})}
  function snap(exists,doc){return {exists:exists,data:function(){return doc||undefined}}}
  function connect(){
    sock=new WebSocket(url);
    sock.onopen=function(){
      open=true;
      var tk=getToken(),gst=getGuest();
      // depois de uma queda ou de um reinício do servidor, entra de novo com a mesma identidade antes de reassinar a mesa
      if(tk&&ME)sock.send(JSON.stringify({t:'auth',token:tk}));
      else if(ME&&ME.guest&&gst)sock.send(JSON.stringify({t:'guest',nick:gst.nick,gid:gst.gid}));
      if(!ONLINE&&G&&!G.over)sock.send(JSON.stringify({t:'presence',mode:'local'}));
      queue.splice(0).forEach(function(m){sock.send(m)});
      Object.keys(subs).forEach(function(c){if(subs[c].length)sock.send(JSON.stringify({t:'sub',code:c}))});
    };
    sock.onmessage=function(ev){
      var m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.id&&pending[m.id]){
        var p=pending[m.id];delete pending[m.id];
        if(m.t==='got')p.res(snap(m.exists,m.doc));
        else if(m.error)p.rej({code:m.error,message:m.error});
        else p.res(m);
      }
      else if(m.t==='doc'&&subs[m.code])subs[m.code].slice().forEach(function(f){f(snap(m.exists,m.doc))});
      else if(m.t==='chat'||m.t==='chathist'||m.t==='emoji'){if(api.onchat)api.onchat(m)}
    };
    sock.onclose=function(){open=false;if(!closed)setTimeout(connect,2000)};
  }
  connect();
  api={
    raw:rpc,send:tx,
    close:function(){closed=true;try{sock.close()}catch(e){}},
    doc:function(path){
      var code=path.split('/')[1];
      return {
        get:function(){return rpc({t:'get',code:code})},
        set:function(d){return rpc({t:'set',code:code,doc:d})},
        update:function(d){return rpc({t:'update',code:code,data:d})},
        delete:function(){return rpc({t:'delete',code:code})},
        onSnapshot:function(next){
          (subs[code]=subs[code]||[]).push(next);tx({t:'sub',code:code});
          return function(){subs[code]=(subs[code]||[]).filter(function(f){return f!==next});if(!subs[code].length)tx({t:'unsub',code:code})};
        }
      };
    }
  };
  return api;
}
async function ensureNet(){
  if(DB&&UID)return true;
  try{
    if(viaClaude()){
      DB=await window.claude.use('db');
      var u=await window.claude.use('user');
      if(u)UID=await u.id();
    }else if(/^https?:$/.test(location.protocol)){
      netDB();
      if(ME)UID=ME.id;
    }
  }catch(e){}
  return !!(DB&&UID);
}

function onRoom(snap){
  if(!snap.exists){
    if(ONLINE||ROOMREF){leaveRoom();showOnline();netMsg('A sala foi encerrada.')}
    return;

  var doc=clone(snap.data());
  if(doc.phase==='lobby'){
    if(!G){ROOM=doc;var m=mySeatIn(doc.seats);if(m>=0){MYSEAT=m;WATCH=false}renderLobby()}
    return;
  }
  if(G&&doc.rev<=REV)return;
  if(G&&WATCH){
    // quem assistia acabou de sentar no lugar de um robô: passa a jogar
    var eu=mySeatIn(doc.seats);
    if(eu>=0){MYSEAT=eu;WATCH=false;closeLayer();deitar();showToast({n:'Mesa',x:'Você sentou na mesa! Boa partida.'})}

  if(!G){
    var me=mySeatIn(doc.seats);
    if(me<0&&!WATCH){leaveRoom();showOnline();netMsg('Esse jogo já começou e você não tem lugar nele.');return}
    MYSEAT=me;
  }
  setupFromSeats(doc.seats);
  adopt(doc);

async function createRoom(name){

  var code,ref,tries=0;
  do{code=genCode();ref=DB.doc('rooms/'+code);var sn=await ref.get();if(!sn.exists)break}while(++tries<5);

  var doc={rev:0,phase:'lobby',host:UID,code:code,game:null,mode:LOCALNP===2?'2':'4',seats:{
    '0':{type:'human',uid:UID,name:name},'1':{type:'bot',uid:null,name:b1},
    '2':{type:'open',uid:null,name:''},'3':{type:'bot',uid:null,name:b3}}};
  try{await ref.set(doc)}catch(e){netMsg('Não consegui criar a sala. Peça ao dono do jogo acesso de colaborador.');return}
  ROOMREF=ref;ROOM=doc;enterOnline(0,true);REV=0;subscribe();renderLobby();

/* "Começar" com uma só pessoa e robôs: a partida vira uma mesa de verdade no servidor, que aparece em "Mesas abertas".
   Outras pessoas podem assistir e sentar no lugar de um robô quando a rodada acabar. Sem conexão a tempo, cai na partida local. */
async function abrirMesaComRobos(name,cancelado){
  if(!(await ensureNet()))return false;
  var code,ref,tries=0;
  do{code=genCode();ref=DB.doc('rooms/'+code);var sn=await ref.get();if(!sn.exists)break}while(++tries<5);
  if(cancelado())return false;
  var duo=LOCALNP===2,usados=[];
  function robo(){var n=pickBot(usados);usados.push(n);return n}
  var doc={rev:0,phase:'lobby',host:UID,code:code,game:null,mode:duo?'2':'4',seats:{
    '0':{type:'human',uid:UID,name:name},'1':{type:'bot',uid:null,name:robo()},
    '2':{type:'bot',uid:null,name:robo()},'3':{type:'bot',uid:null,name:robo()}}};
  await ref.set(doc);
  if(cancelado()){try{ref.delete()}catch(e){}return false}
  ROOMREF=ref;ROOM=doc;enterOnline(0,true);REV=0;subscribe();
  NP=duo?2:4;
  setupFromSeats(ROOM.seats);MYSEAT=0;ROOM.phase='play';shownHand=-1;closeLayer();
  newGame();
  return true;
}
async function comecarPartida(){
  var humanos=activeSeats().filter(function(s){return CFG.human[s]}).length;
  var online=!viaClaude()&&/^https?:$/.test(location.protocol)&&humanos===1;
  if(!online){newGame();return}
  openLayer('<div class="card"><h2>Abrindo a mesa...</h2><p class="small">Conectando ao servidor para a sua mesa aparecer para os outros jogadores.</p></div>');
  var cancel=false,timer=setTimeout(function(){cancel=true;closeLayer();newGame()},8000);   // servidor dormindo: joga sozinho e segue
  try{
    if(!ME&&!(await autoLogin())){
      var g=getGuest();
      await entrarConvidado(g?g.nick:'Visitante'+Math.floor(1000+Math.random()*9000));
    }
    if(cancel)return;
    var ok=await abrirMesaComRobos(ME.nick,function(){return cancel});
    clearTimeout(timer);
    if(!ok&&!cancel){closeLayer();newGame()}
  }catch(e){
    clearTimeout(timer);
    if(!cancel){closeLayer();newGame()}
  }
}
async function joinRoom(code,name){
  if(!(await ensureNet())){netMsg('O jogo online só funciona logado no claude.ai, abrindo o link do jogo.');return}
  code=code.toUpperCase().replace(/[^A-Z]/g,'');
  if(code.length!==4){netMsg('O código tem 4 letras.');return}
  var ref=DB.doc('rooms/'+code),sn;
  try{sn=await ref.get()}catch(e){netMsg('Não consegui acessar a sala.');return}
  if(!sn.exists){netMsg('Sala não encontrada.');return}
  var doc=clone(sn.data()),me=mySeatIn(doc.seats);
  if(doc.phase==='play'&&me<0){netMsg('Esse jogo já começou.');return}
  MYNAME=name;ROOMREF=ref;ROOM=doc;enterOnline(me,doc.host===UID);REV=0;
  subscribe();
  if(doc.phase==='lobby')renderLobby();
}
/* Quem assiste pode sentar no lugar de um robô: na hora, se a cadeira ficou vaga porque alguém saiu; senão, quando a rodada acaba. */
function takeable(){
  if(!WATCH||!ROOM||!G||!ROOM.seats)return [];
  return activeSeats().filter(function(s){var x=ROOM.seats[s];return x&&x.type==='bot'&&(x.left||G.handOver)});
}
function reservado(){return !!(ROOM&&ROOM.reservas&&ROOM.reservas.some(function(r){return r.uid===UID}))}
function sitPill(){
  var t=takeable();
  if(t.length)return '<button class="btn" id="btnSit">Sentar na mesa</button>';
  if(reservado()){
    var pos=ROOM.reservas.findIndex(function(r){return r.uid===UID})+1;
    return '<button class="btn ghost" id="btnSit" data-wait="1">Lugar reservado'+(pos>1?' ('+pos+'º da fila)':'')+' · você entra quando a rodada acabar · toque para cancelar</button>';
  }
  var temRobo=activeSeats().some(function(s){var x=ROOM&&ROOM.seats&&ROOM.seats[s];return x&&x.type==='bot'});
  return '<button class="btn" id="btnSit" data-wait="1">'+(temRobo?'Reservar lugar (entra quando a rodada acabar)':'Reservar lugar (entra se alguém sair)')+'</button>';
}
function sitButtons(){
  return takeable().map(function(s){
    var par=NP===2?'':(' · '+(team(s)===0?'Dupla A':'Dupla B'));
    return '<button class="btn" data-take="'+s+'">Sentar no lugar de '+esc(nm(s))+esc(par)+'</button>';
  }).join('');
}
function takeSeat(s){
  if(!DB||!ROOM)return;
  DB.raw({t:'take',code:ROOM.code,seat:s}).then(function(){closeLayer()}).catch(function(e){
    var msg={espere_rodada:'Só dá para sentar quando a rodada acabar.',indisponivel:'Esse lugar não está mais disponível.',ja_sentado:'Você já está sentado nesta mesa.'}[e&&e.code]||'Não consegui sentar agora.';
    showToast({n:'Mesa',x:msg});
  });
}
function wireTake(){
  document.querySelectorAll('#layer [data-take]').forEach(function(b){b.onclick=function(){takeSeat(b.dataset.take)}});
}
function sitFlow(){
  var t=takeable();
  if(!t.length){
    // ainda não dá para sentar: toque reserva o lugar (entra sozinho quando liberar) e outro toque cancela
    if(!DB||!ROOM)return;
    if(reservado()){
      DB.raw({t:'unreserve',code:ROOM.code}).then(function(){showToast({n:'Mesa',x:'Reserva cancelada.'})}).catch(function(){});
      return;
    }
    DB.raw({t:'reserve',code:ROOM.code}).then(function(r){
      if(!r.sentou)showToast({n:'Mesa',x:'Lugar reservado: você entra sozinho assim que a rodada acabar.'});
    }).catch(function(e){
      showToast({n:'Mesa',x:{fila_cheia:'A fila desta mesa está cheia.',ja_sentado:'Você já está sentado nesta mesa.'}[e&&e.code]||'Não consegui reservar agora.'});
    });
    return;
  }
  if(t.length===1){takeSeat(t[0]);return}
  openLayer('<div class="card"><h2>Sentar na mesa</h2><p>Escolha o lugar de um robô:</p><div class="btns" style="flex-direction:column">'+sitButtons()+'</div><button class="btn ghost" id="sitx">Cancelar</button></div>');
  wireTake();$('sitx').onclick=closeLayer;
}
/* Assistir uma mesa: entra só para ver (as peças dos jogadores ficam escondidas) e pode escrever no chat. */
async function watchRoom(code){
  if(!(await ensureNet())){netMsg('Sem conexão com o servidor.');return}
  var ref=DB.doc('rooms/'+code),sn;
  try{sn=await ref.get()}catch(e){netMsg('Não consegui acessar a mesa.');return}
  if(!sn.exists){netMsg('Mesa não encontrada.');return}
  var doc=clone(sn.data());
  WATCH=true;MYNAME=ME?ME.nick:MYNAME;ROOMREF=ref;ROOM=doc;enterOnline(-1,false);REV=0;
  subscribe();
  if(doc.phase==='lobby')renderLobby();
}
function renderLobby(){
  if(!ROOM||G)return;
  var seats=ROOM.seats,me=mySeatIn(seats),open=0;
  function row(s){
    var x=seats[s],txt,act='';
    if(x.type==='open')open++;
    if(x.type==='human')txt=esc(x.name)+(x.uid===UID?' (você)':'');
    else if(x.type==='bot')txt=esc(x.name||'Robô');
    else txt='<span class="small">vaga aberta</span>';
    if(IAMHOST&&s!==0&&x.type!=='human')act='<div class="seg" data-s="'+s+'"><button data-t="bot" class="'+(x.type==='bot'?'on':'')+'">Robô</button><button data-t="open" class="'+(x.type==='open'?'on':'')+'">Humano</button></div>';
    else if(!IAMHOST&&me<0&&x.type==='open')act='<button class="btn" data-sit="'+s+'" style="min-height:40px">Sentar aqui</button>';
    return '<div class="hrow"><div class="hn" style="flex:1">'+txt+'</div>'+act+'</div>';
  }
  var duo=ROOM.mode==='2';
  var modeBox=IAMHOST?'<div class="seg" id="modeseg"><button data-m="4" class="'+(duo?'':'on')+'">Duplas (4)</button><button data-m="2" class="'+(duo?'on':'')+'">1 contra 1</button></div>'
    :'<p class="small">Modo: '+(duo?'1 contra 1':'duplas (4 jogadores)')+'</p>';
  var body=duo?'<div class="small">Jogador 1</div>'+row(0)+'<div class="small">Jogador 2</div>'+row(2)
    :'<div class="small">Dupla A</div>'+row(0)+row(2)+'<div class="small">Dupla B</div>'+row(1)+row(3);
  var foot=IAMHOST?'<button class="btn" id="os"'+(open?' disabled':'')+'>'+(open?'Falta preencher as vagas':'Começar o jogo')+'</button>'
    :(me<0?'<p class="small">Escolha uma vaga aberta.</p>':'<p class="small">Você está dentro. Aguardando o anfitrião começar.</p>');
  openLayer('<div class="card"><h2>Sala '+esc(ROOM.code)+'</h2><p>Quem vai entrar abre este mesmo jogo, toca em Jogar online e digita o código <b>'+esc(ROOM.code)+'</b>.</p>'
    +modeBox+'<div class="hands">'+body+'</div>'+foot+(chatEnabled()?'<button class="btn ghost" id="ochat">Bate-papo'+(unread?' ('+unread+')':'')+'</button>':'')+'<button class="btn ghost" id="ox">Sair da sala</button></div>');
  if($('ochat'))$('ochat').onclick=openChat;
  if($('modeseg'))$('modeseg').addEventListener('click',function(ev){
    var b=ev.target.closest('button');if(!b)return;
    ROOMREF.update({mode:b.dataset.m}).catch(function(e){console.error(e)});
  });
  document.querySelectorAll('#layer .seg').forEach(function(sg){
    if(sg.id==='modeseg')return;
    sg.addEventListener('click',function(ev){
      var b=ev.target.closest('button');if(!b)return;
      var s=+sg.dataset.s,o={};
      var usados=[0,1,2,3].map(function(k){return ROOM.seats[k]&&ROOM.seats[k].name});
      o[s]={type:b.dataset.t,uid:null,name:b.dataset.t==='bot'?pickBot(usados):''};
      ROOMREF.update({seats:o}).catch(function(e){console.error(e)});
    });
  });
  document.querySelectorAll('#layer [data-sit]').forEach(function(b){
    b.onclick=function(){
      deitar();
      var o={};o[b.dataset.sit]={type:'human',uid:UID,name:MYNAME||'Jogador'};
      ROOMREF.update({seats:o}).catch(function(e){console.error(e)});
    };
  });
  if($('os'))$('os').onclick=function(){
    deitar();
    NP=ROOM.mode==='2'?2:4;
    setupFromSeats(ROOM.seats);MYSEAT=0;ROOM.phase='play';shownHand=-1;closeLayer();newGame();
  };
  $('ox').onclick=function(){leaveRoom();showSetup()};
}
function takeover(s){
  ROOM.seats[s]={type:'bot',uid:null,name:nm(s)+' (robô)'};
  CFG.human[s]=false;CFG.names[s]=ROOM.seats[s].name;
  closeLayer();pushState();step(true);
}
/* Lista de mesas abertas com quem já está nelas; atualiza a cada 4 segundos enquanto a tela está aberta. */
var TABLES_T=null;
function stopTables(){if(TABLES_T){clearInterval(TABLES_T);TABLES_T=null}}
function startTables(){
  stopTables();
  function tick(){
    if(!$('mesas')||!ME||!DB){stopTables();return}
    DB.raw({t:'online'}).then(function(r){
      var box=$('agora');if(!box)return;
      var list=r.list||[];
      box.innerHTML=list.length?list.map(function(u){
        return '<div class="mesa"><div class="mi"><strong>'+esc(u.nick)+'</strong><small>'+esc(u.onde)+'</small></div></div>';
      }).join(''):'<p class="small">Ninguém conectado agora.</p>';
    }).catch(function(){});
    DB.raw({t:'rooms'}).then(function(r){
      var el=$('mesas');if(!el){stopTables();return}
      var list=r.list||[];
      el.innerHTML=list.length?list.map(function(m){
        var info=m.playing?'em jogo'+(m.scores?' · '+m.scores[0]+' x '+m.scores[1]:'')+(m.robos?' · '+m.robos+(m.robos===1?' robô':' robôs')+' (dá para sentar quando a rodada acabar)':''):(m.open?m.open+(m.open===1?' vaga':' vagas'):'mesa cheia');
        return '<div class="mesa"><div class="mi"><strong>'+esc(m.code)+'</strong> · '+(m.mode==='2'?'1 contra 1':'Duplas')
          +'<small>'+esc(m.players.join(', ')||'ninguém ainda')+' · '+info+'</small></div>'
          +'<div class="mb">'+(m.open?'<button class="btn" data-join="'+esc(m.code)+'">Entrar</button>':'')
          +'<button class="btn ghost" data-watch="'+esc(m.code)+'">Assistir</button></div></div>';
      }).join(''):'<p class="small">Nenhuma mesa agora. Crie uma e chame um amigo.</p>';
      el.querySelectorAll('[data-join]').forEach(function(b){
        b.onclick=function(){netMsg('Entrando...');joinRoom(b.dataset.join,ME.nick)};
      });
      el.querySelectorAll('[data-watch]').forEach(function(b){
        b.onclick=function(){netMsg('Abrindo a mesa...');watchRoom(b.dataset.watch)};
      });
    }).catch(function(){});
  }
  tick();TABLES_T=setInterval(tick,4000);
}
function showOnline(){
  openLayer('<div class="card"><h2>Jogar online</h2><p>Cada um joga no seu celular. '+(viaClaude()?'Quem entrar precisa estar logado no claude.ai e ter acesso de colaborador a este jogo.':'Crie a sala e passe o código de 4 letras para os outros jogadores.')+'</p>'
    +(ME?'<div class="me"><strong>'+esc(ME.nick)+'</strong><span id="mest">'+(ME.guest?'convidado · não entra no ranking':statTxt(ME.wins,ME.losses,ME.abandons))+'</span></div>'
        :'<div class="seat"><label>Seu nome</label><input id="on" value="'+esc(CFG.names[0])+'" maxlength="14" aria-label="Seu nome"></div>')
    +'<button class="btn" id="oc">Criar sala</button>'
    +(ME?'<div class="rkhead"><span>Mesas abertas</span></div><div id="mesas" class="mesas"></div>'
        +'<div class="rkhead"><span>Jogando agora</span></div><div id="agora" class="mesas"></div>':'')
    +'<div class="seat"><label>Código da sala</label><input id="oj" maxlength="4" autocapitalize="characters" placeholder="ABCD" style="text-transform:uppercase" aria-label="Código da sala"></div>'
    +'<button class="btn" id="oe">Entrar na sala</button><p class="small" id="omsg"></p>'
    +(ME?'<div class="btns"><button class="btn ghost" id="orank">Ranking</button><button class="btn ghost" id="oout">'+(ME.guest?'Sair (convidado)':'Sair da conta')+'</button></div>':'')
    +'<button class="btn ghost" id="ob">Voltar</button></div>');
  function nameOf(){return ME?ME.nick:($('on').value.trim()||'Jogador')}
  $('oc').onclick=function(){netMsg('Criando a sala...');createRoom(nameOf())};
  $('oe').onclick=function(){netMsg('Entrando...');joinRoom($('oj').value,nameOf())};
  $('ob').onclick=showSetup;
  if(ME){
    startTables();
    $('orank').onclick=showRanking;
    $('oout').onclick=logout;
    if(!ME.guest)DB.raw({t:'me'}).then(function(r){ME.wins=r.wins;ME.losses=r.losses||0;ME.abandons=r.abandons||0;var el=$('mest');if(el)el.textContent=statTxt(ME.wins,ME.losses,ME.abandons)}).catch(function(){});
  }
}

try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!viaClaude())navigator.serviceWorker.register('/sw.js').catch(function(){})}catch(e){}
showSetup();
})();
